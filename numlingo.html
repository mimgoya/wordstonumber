<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numlingo</title>
    <link rel="stylesheet" href="/CSS/numlingo.css">
</head>
<body>
    <div class="container">
        <img src="/IMAGES/duolingo-logo-png-sharp-details.png" alt="" width="200px" >
        <div class="box">
            <header>Numlingo</header>
            <p>Number to Words Converter</p>
            <input id="text" type="number" placeholder="Type any number">
            <button id="convertbtn">Convert</button>
        </div>
        <div class="output">
            <p id="p2">Result: <span id="result"></span></p>
        </div>
        <br>
        <div class="emptybox">
    
        </div>
    </div>
    
    <script src="/JAVASCRIPT/numlingo.js"></script>
</body>
</html>
